name: Build GVE Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests and Build Debug APK
        id: build
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "android/settings.gradle.kts" ]; then
            PROJECT_DIR="android"
          elif [ -f "gve-editor-android/settings.gradle.kts" ]; then
            PROJECT_DIR="gve-editor-android"
          else
            echo "Could not find settings.gradle.kts"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          cd "$PROJECT_DIR"
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gve-editor-debug-apk
          path: ${{ steps.build.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
